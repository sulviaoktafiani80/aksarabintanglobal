<script>
(()=>{'use strict';
const KEY='abg-demo-v1', THEME='abg-theme';
const seed=()=>({programs:[{id:1,name:'Pembelajaran Mendalam untuk Guru',category:'Pengembangan Guru',mode:'Blended',duration:'32 JP',price:450000,lessons:['Orientasi dan Capaian Pembelajaran','Prinsip Pembelajaran Mendalam','Praktik Perancangan Pembelajaran','Refleksi dan Evaluasi']},{id:2,name:'Supervisi Akademik dan Coaching',category:'Kepemimpinan Sekolah',mode:'Daring',duration:'24 JP',price:350000,lessons:['Pengantar Supervisi Akademik','Teknik Observasi Pembelajaran','Percakapan Coaching','Rencana Tindak Lanjut']},{id:3,name:'Outcome-Based Education untuk Dosen',category:'Perguruan Tinggi',mode:'Daring',duration:'20 JP',price:550000,lessons:['Konsep OBE','Pemetaan CPL dan CPMK','Penyusunan RPS','Asesmen Berbasis Capaian']},{id:4,name:'Analisis Data Penelitian Pendidikan',category:'Penelitian',mode:'Luring',duration:'30 JP',price:650000,lessons:['Dasar Analisis Data','Pembersihan Data','Analisis Deskriptif','Interpretasi Hasil']},{id:5,name:'Persiapan Portofolio Sertifikasi Kompetensi',category:'Persiapan Sertifikasi',mode:'Blended',duration:'16 JP',price:300000,lessons:['Pengenalan Standar Kompetensi','Persyaratan dan Dokumen','Pengumpulan Bukti','Simulasi Wawancara']}],enrollments:[],consultations:[{id:1,org:'SMA Contoh Nusantara',service:'Pengembangan Kurikulum',contact:'Koordinator Demo',status:'Peninjauan',progress:25}],partners:[{id:1,name:'Institusi Pendidikan Contoh',type:'Sekolah',status:'Prospek'}],certificates:[],invoices:[],notifications:[{id:1,text:'Selamat datang di demonstrasi ABG-LMS',read:false}],settings:{org:'AKSARA BINTAN GLOBAL',timezone:'Asia/Jakarta'},user:{name:'Pengguna Demonstrasi',role:'Super Admin'},nextId:10});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed()}catch{state=seed()}let page='beranda', appPage='dashboard', keyword='', filter='Semua', currentCourse=null;const roles=['Super Admin','Direktur / Pimpinan','Admin Akademik','Admin Keuangan','Koordinator Program','Instruktur','Konsultan','Peserta','Admin Institusi','Mitra LSP','Auditor / Reviewer'];const groups=[{label:'UTAMA',items:[['dashboard','▦','Dashboard'],['academy','▤','AKSARA Academy'],['learning','▶','Kelas Saya']]},{label:'LAYANAN PROFESIONAL',items:[['consulting','◈','AKSARA Consulting'],['competency','✦','AKSARA Competency'],['partnership','♧','AKSARA Partnership'],['credential','◉','AKSARA Credential']]},{label:'MANAJEMEN',items:[['finance','▣','Administrasi & Keuangan'],['analytics','▥','Analitik & Laporan'],['settings','⚙','Sistem & Pengaturan']]}];

function renderPublic(){const s=state.programs;$('#publicView').innerHTML=`<header class="public-header"><a href="#home" class="brand"><span class="logo">A</span><span>AKSARA BINTAN GLOBAL<small style="display:block">LEARNING • CONSULTING • COMPETENCY</small></span></a><nav class="public-nav"><a href="#layanan">Layanan</a><a href="#program">Program</a><a href="#tentang">Tentang Kami</a><a href="#kontak">Hubungi Kami</a>${btn('Masuk LMS →','app','sm gold keep')}</nav></header><section class="hero" id="home"><div class="hero-inner"><div><span class="eyebrow">INTEGRATED EDUCATION ECOSYSTEM</span><h1>Membangun Kompetensi.<br><span style="color:var(--gold)">Memajukan Pendidikan.</span></h1><p>Ekosistem pembelajaran, pengembangan profesional, konsultansi pendidikan, dan pendampingan persiapan sertifikasi kompetensi dalam satu platform digital.</p><div class="hero-actions">${btn('Jelajahi Program →','catalog','gold')}${btn('Ajukan Konsultasi','consultForm','ghost')}</div><p class="small" style="margin-top:25px;color:#b0c3db">Empowering Education, Advancing Competence</p></div><div class="hero-visual"><div class="orb"><span class="logo">A</span></div><div class="float-card one">▤ &nbsp; Digital Learning</div><div class="float-card two">✦ &nbsp; Competency Development</div><div class="float-card three">◈ &nbsp; Educational Consulting</div></div></div></section><section class="section" id="layanan"><div class="eyebrow">SOLUSI TERINTEGRASI</div><h2>Ekosistem Pengembangan Profesional</h2><p class="muted">Tiga pilar utama layanan dalam satu sistem terintegrasi.</p><div class="grid">${[['▤','AKSARA Academy','Kursus daring, kelas pelatihan, materi pembelajaran, penilaian, dan portofolio digital.','academy'],['◈','AKSARA Consulting','Pendampingan untuk sekolah, perguruan tinggi, dan institusi pendidikan.','consultForm'],['✦','AKSARA Competency','Pembekalan kompetensi dan persiapan sertifikasi melalui mitra yang berwenang.','competency']].map(x=>card(`<div class="service-icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><button class="link-btn" data-act="${x[3]}">Pelajari layanan →</button>`,'service-card')).join('')}</div></section><section style="background:#eaf0f7" id="program"><div class="section"><div class="section-head"><div><div class="eyebrow">PROGRAM PILIHAN</div><h2>Jelajahi Pelatihan AKSARA</h2><div class="muted small">Katalog contoh untuk demonstrasi — bukan jadwal atau penawaran resmi.</div></div>${btn('Lihat Semua Program →','catalog','ghost')}</div><div class="grid">${s.slice(0,3).map(courseCard).join('')}</div></div></section><section class="section" id="tentang"><div class="banner"><div><div class="eyebrow">KEMITRAAN INSTITUSI</div><h2 style="margin:12px 0">Bertumbuh dan Bertransformasi Bersama</h2><p style="max-width:610px;color:#cad7e5">Bangun program pengembangan guru, dosen, tenaga profesional, serta layanan konsultansi yang disesuaikan dengan kebutuhan institusi.</p></div>${btn('Ajukan Kerja Sama','partnerForm','gold')}</div><div style="margin-top:24px" class="notice">Ini adalah prototipe interaktif dengan data demonstrasi. Informasi legalitas, mitra LSP, jadwal resmi, dan sertifikasi akan ditampilkan setelah diverifikasi.</div></section><footer class="footer" id="kontak"><div><strong style="color:white">AKSARA BINTAN GLOBAL</strong><br><span class="small">Empowering Education, Advancing Competence</span></div><span class="small">© <span id="year"></span> AKSARA BINTAN GLOBAL • Prototipe LMS</span>${btn('Buka Dashboard','app','sm gold')}</footer>`;$('#year').textContent=new Date().getFullYear()}
function sidebar(){return `<aside class="sidebar" id="side"><a href="#" data-act="public" class="brand"><span class="logo">A</span><span>AKSARA BINTAN<br>GLOBAL<small style="display:block">ABG–LMS</small></span></a>${groups.map(g=>`<div class="side-label">${g.label}</div>${g.items.map(i=>`<button class="side-button ${appPage===i[0]?'active':''}" data-act="nav:${i[0]}"><span class="ico">${i[1]}</span>${i[2]}</button>`).join('')}`).join('')}<div class="sidebar-bottom"><div class="role-tag">● MODE DEMONSTRASI</div><p class="small">Konten tersimpan lokal pada browser ini.</p>${btn('Kembali ke Website','public','ghost sm')}</div></aside>`}
function renderApp(){const names={dashboard:'Dashboard Utama',academy:'AKSARA Academy',learning:'Kelas Saya',consulting:'AKSARA Consulting',competency:'AKSARA Competency',partnership:'AKSARA Partnership',credential:'AKSARA Credential',finance:'Administrasi & Keuangan',analytics:'Analitik & Laporan',settings:'Sistem & Pengaturan'};$('#appView').innerHTML=`<div class="app-shell">${sidebar()}<main class="main"><div class="topbar"><div style="display:flex;align-items:center;gap:13px"><button class="btn ghost sm nav-mobile" data-act="menu" aria-label="Buka menu">☰</button><div><strong>${names[appPage]||'ABG LMS'}</strong><div class="small muted">${date()}</div></div></div><div class="right"><button class="btn ghost sm" data-act="theme" title="Ganti tema">◐</button><button class="btn ghost sm" data-act="notifications" title="Notifikasi">♧ ${state.notifications.filter(x=>!x.read).length}</button><select id="role" aria-label="Pilih peran demo" class="select" style="max-width:170px;padding:9px">${roles.map(r=>`<option ${state.user.role===r?'selected':''}>${r}</option>`).join('')}</select></div></div><div class="workspace">${renderPage()}</div></main></div>`;$('#role').addEventListener('change',e=>{state.user.role=e.target.value;persist();toast('Mode tampilan: '+e.target.value);renderApp()})}
function renderPage(){switch(appPage){case'dashboard':return dashboard();case'academy':return academy();case'learning':return learning();case'consulting':return consulting();case'competency':return competency();case'partnership':return partnership();case'credential':return credential();case'finance':return finance();case'analytics':return analytics();case'settings':return settings();default:return dashboard()}}
function dashboard(){const n=state.enrollments.length;const total=state.invoices.filter(i=>i.status==='Lunas').reduce((s,i)=>s+i.amount,0);const stats=[['Program Terdaftar',state.programs.length,'▤','academy'],['Pendaftaran',n,'♧','learning'],['Proyek Konsultansi',state.consultations.length,'◈','consulting'],['Mitra Institusi',state.partners.length,'♧','partnership'],['Sertifikat Internal',state.certificates.length,'◉','credential'],['Tagihan Demo',state.invoices.length,'▣','finance'],['Pendapatan Tercatat',money(total),'↗','finance'],['Progres Selesai',state.enrollments.filter(e=>e.completed?.length>=state.programs.find(p=>p.id===e.programId)?.lessons.length).length,'✓','learning']];return `${title('Selamat Datang di AKSARA LMS','Pusat kendali pembelajaran, konsultansi, dan pengembangan kompetensi.',btn('+ Tambah Program','newProgram','sm'))}<div class="notice" style="margin-bottom:18px"><strong>Mode demonstrasi.</strong> Data dan aktivitas pada halaman ini adalah contoh yang tersimpan lokal. Belum terhubung ke server, database, pembayaran, atau LSP.</div><div class="stat-grid">${stats.map(a=>`<div class="stat" role="button" tabindex="0" data-act="nav:${a[3]}"><div class="symbol">${a[2]}</div><div class="muted small">${a[0]}</div><div class="value">${a[1]}</div><div class="note">Lihat detail →</div></div>`).join('')}</div><div class="two-col">${card(`<div class="section-head"><div><h3 style="margin:0">Program Pelatihan</h3><span class="small muted">Katalog program demonstrasi</span></div>${btn('Kelola Program','nav:academy','sm ghost')}</div><div class="table-wrap"><table class="table"><thead><tr><th>PROGRAM</th><th>METODE</th><th>BIAYA</th></tr></thead><tbody>${state.programs.slice(0,5).map(p=>`<tr><td><strong>${esc(p.name)}</strong><br><span class="small muted">${esc(p.category)}</span></td><td>${tag(p.mode)}</td><td>${money(p.price)}</td></tr>`).join('')}</tbody></table></div>`)}${card(`<h3 style="margin-top:0">Akses Cepat</h3><div class="kpis"><div>${btn('Jelajahi Pelatihan →','nav:academy','ghost sm')}</div><div>${btn('Pengajuan Konsultansi →','consultForm','ghost sm')}</div><div>${btn('Kelola Kemitraan →','nav:partnership','ghost sm')}</div><div>${btn('Lihat Analitik →','nav:analytics','ghost sm')}</div></div><p class="small muted">Mode peran: <strong>${esc(state.user.role)}</strong>. Pengalihan peran di prototipe hanya untuk pratinjau, bukan autentikasi atau otorisasi.</p>`)}</div>`}
function academy(){let list=state.programs.filter(p=>(filter==='Semua'||p.category===filter)&&p.name.toLowerCase().includes(keyword.toLowerCase()));return `${title('AKSARA Academy','Kelola program, peserta, materi, serta pembelajaran interaktif.',btn('+ Program Baru','newProgram','sm'))}<div class="toolbar"><input class="searchbox" id="find" placeholder="Cari program..." value="${esc(keyword)}" aria-label="Cari program"><select class="select" id="cat" style="max-width:235px"><option>Semua</option>${[...new Set(state.programs.map(p=>p.category))].map(c=>`<option ${filter===c?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="muted small">${list.length} program tersedia</span></div><div class="course-list">${list.map(courseCard).join('')||'<div class="empty">Tidak ada program yang sesuai.</div>'}</div>`}
function learning(){const list=state.enrollments;return `${title('Kelas Saya','Pantau pembelajaran dan selesaikan seluruh modul yang terdaftar.',btn('Cari Program','nav:academy','sm'))}${!list.length?card('<div class="empty"><h3>Belum ada kelas terdaftar</h3><p>Mulai dengan memilih program di katalog AKSARA Academy.</p>'+btn('Jelajahi Program','nav:academy')+'</div>'):`<div class="grid">${list.map(e=>{const p=state.programs.find(x=>x.id===e.programId);if(!p)return '';const per=Math.round(100*(e.completed?.length||0)/p.lessons.length);return card(`<div class="pill">KELAS DEMONSTRASI</div><h3>${esc(p.name)}</h3><div class="muted small">${esc(p.duration)} • ${esc(p.mode)}</div><p class="small">${per}% selesai</p><div class="progress"><i style="width:${per}%"></i></div><div style="margin-top:18px">${btn('Lanjutkan Kelas →','lesson:'+p.id,'sm')}</div>`)}).join('')}</div>`}`}
function lesson(id){const p=state.programs.find(x=>x.id===id),e=state.enrollments.find(x=>x.programId===id);if(!p||!e){toast('Anda belum terdaftar pada program ini');return}currentCourse=id;appPage='lesson';$('#appView .workspace').innerHTML=`${title('Ruang Belajar','Program: '+esc(p.name),btn('← Kelas Saya','nav:learning','ghost sm'))}<div class="lesson-layout">${card(`<span class="pill">KELAS DEMONSTRASI</span><h2>${esc(p.name)}</h2><p class="muted">Selesaikan seluruh topik di bawah ini untuk memperoleh sertifikat pelatihan demonstrasi.</p>${p.lessons.map((l,i)=>`<div class="lesson-item ${e.completed.includes(i)?'done':''}"><div><strong>Modul ${i+1}: ${esc(l)}</strong><div class="small muted">Bahan ringkas dan aktivitas simulasi</div></div>${btn(e.completed.includes(i)?'✓ Selesai':'Pelajari','study:'+id+':'+i,'sm '+(e.completed.includes(i)?'ghost':''))}</div>`).join('')}`)}${card(`<h3>Progres Saya</h3><div style="font-size:32px;font-weight:900">${Math.round(e.completed.length/p.lessons.length*100)}%</div><div class="progress"><i style="width:${e.completed.length/p.lessons.length*100}%"></i></div><p class="small muted">${e.completed.length} dari ${p.lessons.length} modul selesai.</p>${btn('Lihat Sertifikat','nav:credential','sm ghost')}`)}</div>`}
function consulting(){return `${title('AKSARA Consulting','Pendampingan profesional untuk sekolah, kampus, dan lembaga.',btn('+ Permohonan Konsultasi','consultForm','sm'))}<div class="stat-grid">${[['Permohonan',state.consultations.length],['Dalam Peninjauan',state.consultations.filter(x=>x.status==='Peninjauan').length],['Dalam Pendampingan',state.consultations.filter(x=>x.status==='Berjalan').length],['Selesai',state.consultations.filter(x=>x.status==='Selesai').length]].map(([a,b])=>`<div class="stat"><div class="muted small">${a}</div><div class="value">${b}</div></div>`).join('')}</div>${card(`<h3>Permohonan & Proyek</h3><div class="table-wrap"><table class="table"><thead><tr><th>INSTITUSI</th><th>LAYANAN</th><th>STATUS</th><th>PROGRES</th><th>AKSI</th></tr></thead><tbody>${state.consultations.map(c=>`<tr><td><strong>${esc(c.org)}</strong><br><span class="small muted">${esc(c.contact)}</span></td><td>${esc(c.service)}</td><td>${tag(c.status)}</td><td>${c.progress}%</td><td>${btn('Detail','consultDetail:'+c.id,'sm ghost')}</td></tr>`).join('')}</tbody></table></div>`)}`}
function competency(){return `${title('AKSARA Competency','Pelatihan kompetensi dan persiapan sertifikasi melalui mitra berwenang.')}<div class="notice" style="margin-bottom:20px">AKSARA LMS tidak menerbitkan sertifikat kompetensi BNSP. Asesmen dan keputusan kompetensi merupakan kewenangan LSP terkait. Daftar mitra dan skema resmi harus diverifikasi sebelum dipublikasikan.</div><div class="grid">${[['01','Pemetaan Kompetensi','Identifikasi kebutuhan pelatihan dan pilihan skema.'],['02','Pelatihan Persiapan','Pelajari kompetensi, latihan, serta siapkan bukti.'],['03','Persiapan Portofolio','Lengkapi persyaratan dokumen sebelum pengajuan kepada LSP.'],['04','Koordinasi dengan LSP','Informasi uji dan hasil hanya berdasarkan konfirmasi mitra resmi.']].map(x=>card(`<span class="eyebrow">TAHAP ${x[0]}</span><h3>${x[1]}</h3><p class="muted">${x[2]}</p>`)).join('')}</div><div style="margin-top:22px">${btn('Lihat Program Persiapan','nav:academy')}</div>`}
function partnership(){return `${title('AKSARA Partnership','Kelola hubungan, pengajuan kerja sama, dan data institusi.',btn('+ Institusi Baru','partnerForm','sm'))}${card(`<h3>Daftar Institusi</h3><div class="table-wrap"><table class="table"><thead><tr><th>INSTITUSI</th><th>JENIS</th><th>STATUS</th></tr></thead><tbody>${state.partners.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.type)}</td><td>${tag(p.status)}</td></tr>`).join('')}</tbody></table></div>`)}`}
function credential(){const issued=state.certificates;const ready=state.enrollments.filter(e=>{let p=state.programs.find(x=>x.id===e.programId);return p&&e.completed.length===p.lessons.length&&!issued.some(c=>c.programId===p.id)});return `${title('AKSARA Credential','Sertifikat pelatihan internal dan portofolio peserta.')}<div class="notice" style="margin-bottom:18px">Verifikasi dalam file ini bersifat lokal dan tidak dapat membuktikan keaslian secara publik. Sertifikat yang dibuat di sini hanya bertanda DEMONSTRASI dan bukan sertifikat kompetensi BNSP.</div>${ready.length?card(`<h3>Memenuhi Syarat (Demo)</h3>${ready.map(e=>{let p=state.programs.find(x=>x.id===e.programId);return `<div class="lesson-item"><strong>${esc(p.name)}</strong>${btn('Terbitkan Sertifikat Demo','issue:'+p.id,'sm')}</div>`}).join('')}`):''}${card(`<h3>Arsip Sertifikat Pelatihan</h3>${issued.length?`<div class="table-wrap"><table class="table"><thead><tr><th>NOMOR</th><th>PROGRAM</th><th>TANGGAL</th><th>AKSI</th></tr></thead><tbody>${issued.map(c=>`<tr><td>${esc(c.number)}</td><td>${esc(c.name)}</td><td>${esc(c.date)}</td><td>${btn('Lihat / Cetak','printCert:'+c.number,'sm ghost')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada sertifikat pelatihan demonstrasi.</div>'}`)}<div style="margin-top:16px">${btn('Periksa Nomor Sertifikat Demo','verifyCert','ghost sm')}</div>`}
function finance(){const inv=state.invoices,total=inv.reduce((s,i)=>s+i.amount,0),paid=inv.filter(i=>i.status==='Lunas').reduce((s,i)=>s+i.amount,0);return `${title('Administrasi & Keuangan','Pencatatan transaksi demonstrasi dan pengelolaan tagihan.',btn('+ Tambah Tagihan Demo','newInvoice','sm'))}<div class="stat-grid"><div class="stat"><div class="muted small">Total Nominal</div><div class="value" style="font-size:23px">${money(total)}</div></div><div class="stat"><div class="muted small">Tercatat Lunas</div><div class="value" style="font-size:23px">${money(paid)}</div></div><div class="stat"><div class="muted small">Belum Lunas</div><div class="value" style="font-size:23px">${money(total-paid)}</div></div><div class="stat"><div class="muted small">Jumlah Tagihan</div><div class="value">${inv.length}</div></div></div>${card(`<div class="section-head"><h3>Daftar Tagihan</h3>${btn('Ekspor CSV','exportInvoice','ghost sm')}</div><div class="table-wrap"><table class="table"><thead><tr><th>NOMOR</th><th>URAIAN</th><th>NOMINAL</th><th>STATUS</th><th>AKSI</th></tr></thead><tbody>${inv.map(i=>`<tr><td>${esc(i.number)}</td><td>${esc(i.description)}</td><td>${money(i.amount)}</td><td>${tag(i.status)}</td><td>${i.status==='Lunas'?'—':btn('Tandai Lunas (Demo)','pay:'+i.id,'sm ghost')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada tagihan.</td></tr>'}</tbody></table></div>`)}`}
function analytics(){const cats=[...new Set(state.programs.map(p=>p.category))];return `${title('Analitik & Laporan','Ikhtisar berdasarkan data demonstrasi saat ini.',btn('Ekspor Rekap CSV','exportPrograms','sm'))}<div class="two-col">${card(`<h3>Distribusi Program per Kategori</h3><div class="chart">${cats.map(c=>{const n=state.programs.filter(p=>p.category===c).length;return `<div class="chart-col" title="${esc(c)}: ${n}"><b style="height:${Math.max(15,n*80)}%"></b><span>${n}</span></div>`}).join('')}</div><div class="small muted" style="margin-top:15px">${cats.map((c,i)=>`${i+1}. ${esc(c)}`).join(' • ')}</div>`)}${card(`<h3>Ringkasan Operasional</h3><div class="kpis"><div>Program tersedia <strong style="float:right">${state.programs.length}</strong></div><div>Pendaftaran peserta demo <strong style="float:right">${state.enrollments.length}</strong></div><div>Permohonan konsultansi <strong style="float:right">${state.consultations.length}</strong></div><div>Institusi mitra demo <strong style="float:right">${state.partners.length}</strong></div><div>Sertifikat internal demo <strong style="float:right">${state.certificates.length}</strong></div></div>`)} </div>`}
function settings(){return `${title('Sistem & Pengaturan','Pengaturan lokal prototipe, identitas, dan preferensi tampilan.')}<div class="two-col">${card(`<h3>Identitas Lembaga</h3><form id="settingsForm" class="settings-list"><label>Nama lembaga<input required name="org" value="${esc(state.settings.org)}"></label><label>Zona waktu<select name="timezone" class="select">${[['Asia/Jakarta','WIB • Asia/Jakarta'],['Asia/Makassar','WITA • Asia/Makassar'],['Asia/Jayapura','WIT • Asia/Jayapura']].map(([v,t])=>`<option value="${v}" ${state.settings.timezone===v?'selected':''}>${t}</option>`).join('')}</select></label><button class="btn" type="submit">Simpan Pengaturan</button></form>`)}${card(`<h3>Mode Demonstrasi</h3><p class="muted small">Aplikasi ini tidak memiliki autentikasi nyata, database daring, payment gateway, validasi BNSP, atau sistem verifikasi sertifikat publik.</p><div class="settings-list">${btn('Ganti Tema Terang / Gelap','theme','ghost')}${btn('Atur Ulang Semua Data Demo','reset','danger')}</div><h3 style="margin-top:26px">Keamanan Produksi</h3><p class="muted small">Wajib implementasi autentikasi server, isolasi data per institusi, pengamanan berkas, audit log, database terkelola, backup, serta verifikasi sertifikat di server sebelum digunakan secara riil.</p>`)}</div>`}
function modal(head,body,footer=''){ $('#modalHost').innerHTML=`<div class="modal-bg" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(head)}"><div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><h2>${esc(head)}</h2><button class="btn ghost sm" data-act="close" aria-label="Tutup">✕</button></div>${body}${footer}</div></div>`;$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')close()})}function close(){$('#modalHost').innerHTML=''}function detail(id){const p=state.programs.find(x=>x.id===id);if(!p)return;const enrolled=state.enrollments.some(x=>x.programId===id);modal(p.name,`<span class="pill">${esc(p.category)}</span><p class="muted">Program pembelajaran ${esc(p.mode)} dengan durasi ${esc(p.duration)}.</p><h3>Silabus</h3><ol>${p.lessons.map(l=>`<li>${esc(l)}</li>`).join('')}</ol><div class="lesson-item"><span>Biaya program (demo)</span><strong>${money(p.price)}</strong></div><div class="notice">Pendaftaran ini bersifat lokal. Tidak ada penagihan atau pembayaran nyata.</div><div class="modal-actions">${btn('Tutup','close','ghost')}${btn(enrolled?'Masuk Kelas':'Daftar Program Demo',enrolled?'openLesson:'+id:'enroll:'+id)}</div>`)}
function formModal(kind){if(kind==='consultForm'){modal('Ajukan Konsultansi',`<form id="consultForm" class="form-grid"><label class="full">Nama institusi<input name="org" maxlength="120" required placeholder="Nama sekolah / kampus / lembaga"></label><label>Nama penanggung jawab<input name="contact" maxlength="90" required></label><label>Jenis layanan<select name="service" class="select"><option>Pengembangan Kurikulum</option><option>Supervisi Akademik</option><option>Penjaminan Mutu Pendidikan</option><option>Penelitian Pendidikan</option><option>Digitalisasi Pembelajaran</option><option>Konsultansi Perguruan Tinggi</option></select></label><label class="full">Deskripsi kebutuhan<textarea name="desc" maxlength="1000" required placeholder="Jelaskan kebutuhan pendampingan"></textarea></label><div class="full modal-actions">${btn('Batal','close','ghost')}<button type="submit" class="btn">Kirim Permohonan Demo</button></div></form>`)}else if(kind==='partnerForm'){modal('Ajukan Kemitraan',`<form id="partnerForm" class="form-grid"><label class="full">Nama institusi<input name="name" required maxlength="120"></label><label>Jenis institusi<select class="select" name="type"><option>Sekolah</option><option>Perguruan Tinggi</option><option>Perusahaan</option><option>Instansi Pemerintah</option><option>Lembaga Lainnya</option></select></label><label>Jenis kerja sama<select class="select" name="collaboration"><option>Pelatihan</option><option>Konsultansi</option><option>Kemitraan Program</option></select></label><div class="full modal-actions">${btn('Batal','close','ghost')}<button type="submit" class="btn">Simpan Pengajuan Demo</button></div></form>`)}else if(kind==='newProgram'){modal('Tambah Program Pelatihan',`<form id="programForm" class="form-grid"><label class="full">Nama program<input name="name" required maxlength="130"></label><label>Kategori<input name="category" required maxlength="80" placeholder="Pengembangan Guru"></label><label>Metode<select class="select" name="mode"><option>Daring</option><option>Luring</option><option>Blended</option></select></label><label>Durasi<input name="duration" required maxlength="30" placeholder="24 JP"></label><label>Biaya (Rp)<input name="price" type="number" min="0" max="1000000000" required value="0"></label><label class="full">Topik pembelajaran (satu topik setiap baris)<textarea name="lessons" required placeholder="Orientasi&#10;Materi Utama&#10;Evaluasi"></textarea></label><div class="full modal-actions">${btn('Batal','close','ghost')}<button type="submit" class="btn">Tambah Program Demo</button></div></form>`)}else if(kind==='newInvoice'){modal('Tambah Tagihan Demo',`<form id="invoiceForm" class="form-grid"><label class="full">Uraian tagihan<input name="description" maxlength="150" required></label><label class="full">Nominal (Rp)<input name="amount" type="number" min="1" max="1000000000" required></label><div class="full modal-actions">${btn('Batal','close','ghost')}<button class="btn" type="submit">Simpan Tagihan</button></div></form>`)}else if(kind==='verifyCert'){modal('Verifikasi Sertifikat Demo',`<form id="verifyForm"><label>Nomor sertifikat pelatihan internal<input name="number" required placeholder="ABG-DEMO-..."></label><div class="modal-actions"><button class="btn" type="submit">Periksa Lokal</button></div></form><div id="verifyResult" style="margin-top:16px"></div>`)} }
function study(id,index){const p=state.programs.find(x=>x.id===id),e=state.enrollments.find(x=>x.programId===id);if(!p||!e)return;modal('Modul '+(index+1),`<span class="pill">${esc(p.name)}</span><h3>${esc(p.lessons[index])}</h3><div class="lesson-body"><p><strong>Aktivitas pembelajaran demonstrasi</strong></p><p>Pelajari pokok bahasan “${esc(p.lessons[index])}”, diskusikan konsep utama, lalu lakukan refleksi singkat tentang penerapannya pada praktik pendidikan atau pekerjaan.</p><p class="small muted">Materi lengkap, video, kuis, dan penilaian riil memerlukan konten instruktur dan sistem backend.</p></div><label>Refleksi singkat (minimal 15 karakter)<textarea id="reflection" placeholder="Tuliskan pemahaman atau penerapan materi ini..."></textarea></label><div class="modal-actions">${btn('Kembali','close','ghost')}<button class="btn" data-act="complete:${id}:${index}">Tandai Selesai</button></div>`)}
function certView(c){modal('Sertifikat Pelatihan Demonstrasi',`<div style="border:8px double #d4a94f;padding:28px;text-align:center;background:white;color:#122847"><div class="eyebrow">AKSARA BINTAN GLOBAL</div><h2 style="font-family:Georgia,serif;margin-top:22px">SERTIFIKAT PELATIHAN</h2><p>Diberikan kepada</p><h2>${esc(c.holder)}</h2><p>Atas penyelesaian program</p><h3>${esc(c.name)}</h3><p>${esc(c.duration)} • ${esc(c.date)}</p><strong style="font-size:11px">${esc(c.number)}</strong><p style="color:#ba3340;font-weight:900;letter-spacing:2px">DEMONSTRASI — TIDAK BERLAKU SEBAGAI SERTIFIKAT RESMI</p></div><div class="modal-actions">${btn('Tutup','close','ghost')}${btn('Cetak','print')}</div>`)}
function exportCSV(rows,name){if(!rows.length){toast('Tidak ada data untuk diekspor');return}const cols=Object.keys(rows[0]),csv=[cols.join(','),...rows.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function action(s){const [a,id,idx]=s.split(':');if(a==='public'){close();showPublic()}else if(a==='app'){close();showApp()}else if(a==='nav'){close();keyword='';filter='Semua';showApp(id)}else if(a==='catalog'){showApp('academy')}else if(a==='academy'){showApp('academy')}else if(a==='competency'){showApp('competency')}else if(a==='menu'){$('#side')?.classList.toggle('show')}else if(a==='theme'){document.body.classList.toggle('dark');localStorage.setItem(THEME,document.body.classList.contains('dark')?'dark':'light')}else if(a==='close')close();else if(['consultForm','partnerForm','newProgram','newInvoice','verifyCert'].includes(a))formModal(a);else if(a==='detail')detail(Number(id));else if(a==='enroll'){const pid=Number(id),p=state.programs.find(x=>x.id===pid);if(!p)return;if(!state.enrollments.some(e=>e.programId===pid)){state.enrollments.push({id:state.nextId++,programId:pid,completed:[]});persist()}close();toast('Pendaftaran demo berhasil. Selamat belajar!');showApp('learning')}else if(a==='openLesson'){close();showApp('learning');lesson(Number(id))}else if(a==='lesson')lesson(Number(id));else if(a==='study')study(Number(id),Number(idx));else if(a==='complete'){let text=$('#reflection')?.value.trim();if(!text||text.length<15){toast('Isi refleksi minimal 15 karakter');return}let e=state.enrollments.find(x=>x.programId===Number(id));if(!e)return;if(!e.completed.includes(Number(idx)))e.completed.push(Number(idx));persist();close();lesson(Number(id));toast('Progres pembelajaran tersimpan')}else if(a==='consultDetail'){const c=state.consultations.find(x=>x.id===Number(id));if(!c)return;modal('Detail Permohonan',`<div class="kpis"><div>Institusi: <strong>${esc(c.org)}</strong></div><div>Layanan: <strong>${esc(c.service)}</strong></div><div>PIC: <strong>${esc(c.contact)}</strong></div><div>Status: ${tag(c.status)}</div><div>Progres: ${c.progress}%</div></div><p class="muted">${esc(c.desc||'Data contoh awal, belum ada dokumen pendampingan.')}</p><div class="modal-actions">${btn('Tutup','close','ghost')}${c.status==='Peninjauan'?btn('Mulai Pendampingan Demo','startProject:'+c.id):c.status==='Berjalan'?btn('Selesaikan Proyek Demo','finishProject:'+c.id):''}</div>`)}else if(a==='startProject'||a==='finishProject'){const c=state.consultations.find(x=>x.id===Number(id));if(c){c.status=a==='startProject'?'Berjalan':'Selesai';c.progress=a==='startProject'?45:100;persist();close();renderApp();toast('Status proyek demonstrasi diperbarui')}}else if(a==='issue'){const p=state.programs.find(x=>x.id===Number(id)),e=state.enrollments.find(x=>x.programId===Number(id));if(!p||!e||e.completed.length!==p.lessons.length){toast('Seluruh modul harus selesai');return}if(state.certificates.some(x=>x.programId===p.id)){toast('Sertifikat sudah ada');return}let c={number:'ABG-DEMO-'+Date.now().toString(36).toUpperCase(),programId:p.id,holder:state.user.name,name:p.name,duration:p.duration,date:new Intl.DateTimeFormat('id-ID',{dateStyle:'long',timeZone:state.settings.timezone}).format(new Date())};state.certificates.push(c);persist();renderApp();certView(c)}else if(a==='printCert'){const c=state.certificates.find(x=>x.number===id);if(c)certView(c)}else if(a==='print')window.print();else if(a==='pay'){const item=state.invoices.find(x=>x.id===Number(id));if(item&&confirm('Tandai tagihan sebagai lunas dalam data DEMONSTRASI?')){item.status='Lunas';persist();renderApp();toast('Status demonstrasi diperbarui')}}else if(a==='exportInvoice')exportCSV(state.invoices,'abg-tagihan-demo.csv');else if(a==='exportPrograms')exportCSV(state.programs.map(p=>({name:p.name,category:p.category,mode:p.mode,duration:p.duration,price:p.price})), 'abg-program-demo.csv');else if(a==='notifications'){state.notifications.forEach(x=>x.read=true);persist();renderApp();toast('Notifikasi demo ditandai terbaca')}else if(a==='reset'){if(confirm('Hapus semua perubahan DEMO pada browser ini dan kembalikan data contoh?')){state=seed();keyword='';filter='Semua';persist();showApp('dashboard');toast('Data demonstrasi telah diatur ulang')}}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-act]');if(target){e.preventDefault();action(target.dataset.act)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();action(e.target.dataset.act)}});
document.addEventListener('input',e=>{if(e.target.id==='find'){const cursor=e.target.selectionStart;keyword=e.target.value;const container=$('#appView .workspace');container.innerHTML=academy();const input=$('#find');input.focus();input.setSelectionRange(cursor,cursor)}});document.addEventListener('change',e=>{if(e.target.id==='cat'){filter=e.target.value;$('#appView .workspace').innerHTML=academy()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));if(f.id==='consultForm'){state.consultations.push({id:state.nextId++,org:d.org.trim(),contact:d.contact.trim(),service:d.service,desc:d.desc.trim(),status:'Peninjauan',progress:0});persist();close();showApp('consulting');toast('Permohonan konsultansi demo tersimpan')}else if(f.id==='partnerForm'){state.partners.push({id:state.nextId++,name:d.name.trim(),type:d.type,status:'Prospek'});persist();close();showApp('partnership');toast('Permohonan kemitraan demo tersimpan')}else if(f.id==='programForm'){const lessons=d.lessons.split('\n').map(x=>x.trim()).filter(Boolean);if(!lessons.length){toast('Minimal satu topik diperlukan');return}state.programs.push({id:state.nextId++,name:d.name.trim(),category:d.category.trim(),mode:d.mode,duration:d.duration.trim(),price:Number(d.price),lessons});persist();close();showApp('academy');toast('Program demo baru ditambahkan')}else if(f.id==='invoiceForm'){state.invoices.push({id:state.nextId++,number:'INV-DEMO-'+Date.now().toString(36).toUpperCase(),description:d.description.trim(),amount:Number(d.amount),status:'Menunggu'});persist();close();showApp('finance');toast('Tagihan demonstrasi ditambahkan')}else if(f.id==='settingsForm'){state.settings.org=d.org.trim();state.settings.timezone=d.timezone;persist();renderApp();toast('Pengaturan berhasil disimpan')}else if(f.id==='verifyForm'){let c=state.certificates.find(x=>x.number.toLowerCase()===d.number.trim().toLowerCase());$('#verifyResult').innerHTML=c?`<div class="notice"><strong>Ditemukan dalam browser ini (DEMO).</strong><br>${esc(c.name)}<br>Nomor: ${esc(c.number)}<br>Tidak merupakan verifikasi resmi/public.</div>`:'<div class="notice">Tidak ditemukan pada data demonstrasi browser ini.</div>'}});
try{if(localStorage.getItem(THEME)==='dark')document.body.classList.add('dark')}catch{}showPublic();
})();
</script>
</body></html>
